<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fabricante-title">
    <title id="fabricante-title">Ilustración: páginas armadas con los mismos bloques reutilizables</title>
    <defs>
