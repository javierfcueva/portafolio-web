<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="avatar-title">
    <title id="avatar-title">Avatar de Javier Cueva: iniciales JC</title>
    <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#2a2d31"/>
        </pattern>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d2b07a" stop-opacity="0.22"/>
            <stop offset="0.6" stop-color="#d2b07a" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e6cc9f"/>
            <stop offset="1" stop-color="#b8925a"/>
        </linearGradient>
    </defs>

    <!-- Fondo -->
    <rect width="480" height="480" rx="28" fill="#16181b"/>
    <rect width="480" height="480" rx="28" fill="url(#dots)"/>
    <rect width="480" height="480" rx="28" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="479" height="479" rx="27.5" fill="none" stroke="#2a2d31"/>

    <!-- Barra superior estilo editor -->
    <circle cx="36" cy="36" r="6" fill="#2a2d31"/>
    <circle cx="56" cy="36" r="6" fill="#2a2d31"/>
    <circle cx="76" cy="36" r="6" fill="#2a2d31"/>
    <text x="444" y="41" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#8a857c">index.html</text>

    <!-- Iniciales -->
    <text x="240" y="282" text-anchor="middle" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="176" font-weight="700" letter-spacing="-8" fill="url(#gold)">JC</text>

    <!-- Etiquetas de código -->
    <text x="240" y="150" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="20" fill="#8a857c">&lt;developer&gt;</text>
    <text x="240" y="340" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="20" fill="#8a857c">&lt;/developer&gt;</text>
</svg>
