<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="migracion-title">
    <title id="migracion-title">Ilustración: contenido que pasa de Joomla a WordPress en siete pasos</title>
    <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#2a2d31"/>
        </pattern>
    </defs>

    <!-- Fondo -->
    <rect width="640" height="400" fill="#16181b"/>
    <rect width="640" height="400" fill="url(#dots)"/>

    <!-- Barra superior estilo editor -->
    <circle cx="28" cy="28" r="5" fill="#2a2d31"/>
    <circle cx="46" cy="28" r="5" fill="#2a2d31"/>
    <circle cx="64" cy="28" r="5" fill="#2a2d31"/>
    <text x="612" y="33" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#8a857c">migracion.py</text>

    <!-- Sitio anterior -->
    <rect x="48" y="78" width="184" height="200" rx="10" fill="#0f1012" stroke="#2a2d31"/>
    <text x="66" y="106" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#8a857c">joomla</text>
    <rect x="66" y="128" width="148" height="8" rx="4" fill="#2a2d31"/>
    <rect x="66" y="152" width="120" height="8" rx="4" fill="#2a2d31"/>
    <rect x="66" y="176" width="136" height="8" rx="4" fill="#2a2d31"/>
    <rect x="66" y="200" width="100" height="8" rx="4" fill="#2a2d31"/>
    <rect x="66" y="224" width="140" height="8" rx="4" fill="#2a2d31"/>
    <rect x="66" y="248" width="112" height="8" rx="4" fill="#2a2d31"/>

    <!-- Script -->
    <text x="320" y="164" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#8a857c">python</text>
    <line x1="248" y1="178" x2="384" y2="178" stroke="#d2b07a" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M382 170 L394 178 L382 186" fill="none" stroke="#d2b07a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sitio nuevo -->
    <rect x="408" y="78" width="184" height="200" rx="10" fill="#0f1012" stroke="#d2b07a"/>
    <text x="426" y="106" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#d2b07a">wordpress</text>
    <rect x="426" y="128" width="148" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="426" y="152" width="120" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="426" y="176" width="136" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="426" y="200" width="100" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="426" y="224" width="140" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="426" y="248" width="112" height="8" rx="4" fill="#d2b07a" fill-opacity="0.45"/>

    <!-- Pasos del proceso -->
    <line x1="80" y1="332" x2="560" y2="332" stroke="#2a2d31" stroke-width="2"/>
    <g fill="#d2b07a">
        <circle cx="80" cy="332" r="7"/>
        <circle cx="160" cy="332" r="7"/>
        <circle cx="240" cy="332" r="7"/>
        <circle cx="320" cy="332" r="7"/>
        <circle cx="400" cy="332" r="7"/>
        <circle cx="480" cy="332" r="7"/>
        <circle cx="560" cy="332" r="7"/>
    </g>
    <g font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12" fill="#8a857c" text-anchor="middle">
        <text x="80" y="362">01</text>
        <text x="160" y="362">02</text>
        <text x="240" y="362">03</text>
        <text x="320" y="362">04</text>
        <text x="400" y="362">05</text>
        <text x="480" y="362">06</text>
        <text x="560" y="362">07</text>
    </g>
</svg>
