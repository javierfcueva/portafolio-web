    <circle cx="46" cy="28" r="5" fill="#2a2d31"/>
    <circle cx="64" cy="28" r="5" fill="#2a2d31"/>
    <text x="612" y="33" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#8a857c">qa-checklist.md</text>

