<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="directorio-title">
    <title id="directorio-title">Ilustración: lista de negocios junto a un mapa con marcadores</title>
    <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#2a2d31"/>
        </pattern>
        <path id="pin" d="M0 -24 C-9 -24 -14 -17 -14 -10 C-14 0 0 12 0 12 C0 12 14 0 14 -10 C14 -17 9 -24 0 -24 Z"/>
    </defs>

    <!-- Fondo -->
    <rect width="640" height="400" fill="#16181b"/>
    <rect width="640" height="400" fill="url(#dots)"/>

    <!-- Barra superior estilo editor -->
    <circle cx="28" cy="28" r="5" fill="#2a2d31"/>
    <circle cx="46" cy="28" r="5" fill="#2a2d31"/>
    <circle cx="64" cy="28" r="5" fill="#2a2d31"/>
    <text x="612" y="33" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#8a857c">directorio.tsx</text>

    <!-- Lista de negocios -->
    <rect x="40" y="70" width="208" height="64" rx="8" fill="#0f1012" stroke="#d2b07a"/>
    <rect x="52" y="82" width="40" height="40" rx="6" fill="#d2b07a" fill-opacity="0.45"/>
    <rect x="104" y="90" width="120" height="8" rx="4" fill="#ece8e1" fill-opacity="0.6"/>
    <rect x="104" y="106" width="80" height="8" rx="4" fill="#2a2d31"/>

    <rect x="40" y="146" width="208" height="64" rx="8" fill="#0f1012" stroke="#2a2d31"/>
    <rect x="52" y="158" width="40" height="40" rx="6" fill="#2a2d31"/>
    <rect x="104" y="166" width="108" height="8" rx="4" fill="#2a2d31"/>
    <rect x="104" y="182" width="72" height="8" rx="4" fill="#2a2d31"/>

    <rect x="40" y="222" width="208" height="64" rx="8" fill="#0f1012" stroke="#2a2d31"/>
    <rect x="52" y="234" width="40" height="40" rx="6" fill="#2a2d31"/>
    <rect x="104" y="242" width="124" height="8" rx="4" fill="#2a2d31"/>
    <rect x="104" y="258" width="88" height="8" rx="4" fill="#2a2d31"/>

    <rect x="40" y="298" width="208" height="64" rx="8" fill="#0f1012" stroke="#2a2d31"/>
    <rect x="52" y="310" width="40" height="40" rx="6" fill="#2a2d31"/>
    <rect x="104" y="318" width="96" height="8" rx="4" fill="#2a2d31"/>
    <rect x="104" y="334" width="64" height="8" rx="4" fill="#2a2d31"/>

    <!-- Mapa -->
    <rect x="268" y="70" width="332" height="292" rx="8" fill="#0f1012" stroke="#2a2d31"/>
    <g stroke="#2a2d31" stroke-width="2">
        <line x1="268" y1="140" x2="600" y2="140"/>
        <line x1="268" y1="220" x2="600" y2="220"/>
        <line x1="268" y1="300" x2="600" y2="300"/>
        <line x1="350" y1="70" x2="350" y2="362"/>
        <line x1="450" y1="70" x2="450" y2="362"/>
        <line x1="540" y1="70" x2="540" y2="362"/>
    </g>
    <line x1="268" y1="350" x2="600" y2="96" stroke="#2a2d31" stroke-width="6"/>

    <!-- Marcadores -->
    <g fill="#8a857c">
        <use href="#pin" transform="translate(320 200)"/>
        <use href="#pin" transform="translate(490 280)"/>
        <use href="#pin" transform="translate(570 190)"/>
        <use href="#pin" transform="translate(400 330)"/>
    </g>
    <use href="#pin" fill="#d2b07a" transform="translate(410 128) scale(1.3)"/>
    <circle cx="410" cy="115" r="5" fill="#0f1012"/>
</svg>
